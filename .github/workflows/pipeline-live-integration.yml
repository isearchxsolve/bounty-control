name: Publisher access diagnosis
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Observe publisher credential without performing writes
      env:
        GH_TOKEN: ${{ secrets.GH_PAT }}
      run: python3 scripts/publication_access_probe.py --repo fiztoz/uptime-phoenix
