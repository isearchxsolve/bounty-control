name: Live pipeline integration
run-name: 'Live integration ${{ github.run_id }}'
'on':
  workflow_dispatch:
    inputs:
      target_repo:
        description: Repository containing the target issue
        type: string
        default: isearchxsolve/oss-hunter-livefire
      issue_number:
        description: Optional issue diagnostic; empty drives the production entry door across real issues
        type: string
        required: false
      resume_run:
        description: Resume a completed master run from retained real checkpoints after repair
        type: string
        required: false
      merge_fixture:
        description: Merge only this run's sandbox PR after real native CI succeeds
        type: boolean
        default: true
concurrency:
  group: pipeline-live-integration
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    # Two production-sized search rounds plus bounded delivery/review observation.
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      TOKENHARBOR_KEYS_JSON: ${{ secrets.TOKENHARBOR_KEYS_JSON }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      # The whole NVIDIA key pool, however the secret publishes it: a JSON list, a
      # {"keys": [...]} document, or newline/comma separated keys. One secret, 11 keys,
      # 11 separate accounts -- so a 429 spends one account's cooldown, not the brain.
      NVIDIA_KEYS_JSON: ${{ secrets.NVIDIA_KEYS_JSON }}
      NVIDIA_ROUTER_MODEL: ${{ vars.NVIDIA_DELIVERY_MODEL || 'nvidia/nemotron-3.5-super-vl-120b-a12b' }}
      PYTHONUNBUFFERED: '1'
      PYTHONIOENCODING: utf-8
      # Publish status facts to the control branch while job logs are still live.
      LIVE_PIPELINE_PROGRESS: '1'
      BOUNTY_AGENT_MEMORY: ${{ github.workspace }}/scratch/live-integration/entry-scout/discovery-memory
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install the same Cline CLI as production
      run: npm install --global --no-audit --no-fund cline@3.0.74
    - name: Install workflow receipt parser
      run: python3 -m pip install PyYAML==6.0.3
    - name: Restore unverified research continuity
      uses: actions/cache/restore@v4
      with:
        path: scratch/live-integration/entry-scout/discovery-memory
        key: pipeline-research-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: pipeline-research-
    - name: Exercise real services and production delivery
      env:
        MERGE_FIXTURE: ${{ inputs.merge_fixture }}
        TARGET_REPO: ${{ inputs.target_repo }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        RESUME_RUN: ${{ inputs.resume_run }}
      run: |
        flags=(--target "$TARGET_REPO")
        if [ -n "$RESUME_RUN" ]; then flags+=(--resume-run "$RESUME_RUN"); fi
        if [ -n "$ISSUE_NUMBER" ]; then flags+=(--issue "$ISSUE_NUMBER"); fi
        if [ "$MERGE_FIXTURE" = true ]; then flags+=(--merge-fixture); fi
        python3 -u scripts/live_pipeline_integration.py run \
          --run-dir scratch/live-integration \
          --model-timeout 3600 --engineering-budget 1800 --wait-minutes 60 "${flags[@]}"
    - name: Preserve unverified research progress
      if: always()
      uses: actions/cache/save@v4
      with:
        path: scratch/live-integration/entry-scout/discovery-memory
        key: pipeline-research-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Retain actual receipts including failed and incomplete runs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: live-integration-${{ github.run_id }}
        path: |
          scratch/live-integration/run.json
          scratch/live-integration/*.log
          scratch/live-integration/*.json
          scratch/live-integration/scout-*/agent.log
          scratch/live-integration/scout-*/result.json
          scratch/live-integration/scout-*/shortlist.jsonl
          scratch/live-integration/scout-*/agent-queue.sqlite3
          scratch/live-integration/scout-*/*.jsonl
          scratch/live-integration/scout-*/agent/run-*/agent.log
          scratch/live-integration/scout-*/agent/run-*/shortlist.jsonl
          scratch/live-integration/scout-*/agent/run-*/decisions.jsonl
          scratch/live-integration/scout-*/agent/run-*/admitted-stream.jsonl
          scratch/live-integration/artifacts-*/
          scratch/live-integration/intake-*/
          scratch/live-integration/hydration-*/
          scratch/live-integration/entry-queue/
          scratch/live-integration/entry-scout/run-*/*.jsonl
          scratch/live-integration/entry-scout/run-*/agent.log
          scratch/live-integration/entry-scout/discovery-memory/RESEARCH.md
          scratch/live-integration/originals/
          scratch/live-integration/continuations/
        if-no-files-found: error
        retention-days: 14
