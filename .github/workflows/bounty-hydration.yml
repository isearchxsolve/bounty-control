name: Bounty hydration drain
'on':
  # Scheduled, and offset from discovery's '7,37' so the two never contend for a slot.
  # Measured 2026-11-02: this schedule was retired on 2026-10-31 to "preserve 100% of API
  # quota for sovereign discovery", but the drain draws on the REST/GraphQL core budget and
  # never on the 30/min search ceiling, so it was never spending discovery's quota. The cost
  # of retiring it was 41 tasks stranded in the durable queue, the oldest from 2026-10-31T23:22Z,
  # with no automated path to dispatch. A backlog with no drain is a silent outage.
  schedule:
  - cron: '22,52 * * * *'
  workflow_dispatch: {}
concurrency:
  # Its own group. Sharing 'bounty-discovery' meant a scheduled drain queued behind a
  # 25-minute discovery run and was then bumped by the next one, so the schedule would have
  # been decorative. Dispatch safety comes from the Contents-API CAS on the durable ledger,
  # not from serialising the two lanes.
  group: bounty-hydration
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  hydrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      BOUNTY_STATE_DIR: /tmp/bounty-state
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        sparse-checkout: '/scripts/

          /.github/

          /.gitmodules'
        sparse-checkout-cone-mode: false
    - uses: actions/cache/restore@v4
      with:
        path: ${{ env.BOUNTY_STATE_DIR }}
        key: bounty-state-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: bounty-state-
    - name: Drain the durable pending queue on the core API budget
      # Hydration-only lane: no search-API calls (the discovery lane saturates the 30/min
      # search ceiling with its own queries), so the drain draws on the REST/GraphQL core
      # budget and is not throttled by the 65-second secondary search waits. Shared durable
      # ownership (bounty-control branch, Contents-API CAS) keeps dispatch safe against the
      # concurrent discovery lane.
      run: python3 -u scripts/actions_dispatch.py --live --once --hydrate-only --hydrate-batch 300 --max-dispatches 2 --lane all
    - uses: actions/cache/save@v4
      if: always()
      with:
        path: ${{ env.BOUNTY_STATE_DIR }}
        key: bounty-state-${{ github.run_id }}-${{ github.run_attempt }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: hydration-${{ github.run_id }}
        path: ${{ env.BOUNTY_STATE_DIR }}
        if-no-files-found: error
        retention-days: 14
