name: Actions migration contracts
'on':
  push:
    paths:
    - scripts/**
    - .github/workflows/**
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        sparse-checkout: '/scripts/

          /.github/

          /.gitmodules'
        sparse-checkout-cone-mode: false
    - name: Compile platform adapters
      run: python3 -W error -m py_compile scripts/actions_github.py scripts/actions_dispatch.py scripts/actions_delivery.py scripts/actions_reconcile.py
        scripts/actions_release.py scripts/bounty_admission.py scripts/bounty_fx.py scripts/kaggle_engine_worker.py scripts/delivery_supervisor.py
        scripts/discovery_heartbeat.py scripts/delivery_errors.py scripts/f11_refusal_census.py scripts/failure_digest.py
    - name: Refuse undefined names on the scheduled pipeline modules
      # F821 is the lint class that reaches production as a crash: run 40876500657 died with
      # "name 'report_path' is not defined" the first time any run reached that line. Scoped to
      # the modules the workflows actually execute, so legacy scratch seeds cannot fail the gate.
      run: |
        python3 -m pip install --quiet ruff
        python3 -m ruff check --select F821 \
          scripts/actions_github.py scripts/actions_dispatch.py scripts/actions_delivery.py \
          scripts/actions_reconcile.py scripts/actions_release.py scripts/bounty_admission.py \
          scripts/bounty_fx.py scripts/kaggle_engine_worker.py scripts/delivery_supervisor.py \
          scripts/delivery_errors.py scripts/discovery_heartbeat.py scripts/failure_digest.py \
          scripts/f11_refusal_census.py
    - name: Test migration contracts and unchanged master suites
      env:
        PYTHONIOENCODING: utf-8
      run: 'python3 -W error scripts/test_actions_migration.py

        python3 -W error scripts/test_partition_regressions.py

        python3 -W error scripts/test_cline_delivery_ownership.py

        python3 -W error scripts/test_icu_pipeline_suite.py

        python3 -W error scripts/test_discovery_breadth.py

        python3 -W error scripts/test_admission_trust.py

        python3 -W error scripts/test_repository_intent.py

        python3 -W error scripts/test_program_offers.py

        python3 -W error scripts/test_queue_ordering.py

        python3 -W error scripts/test_by_design_gate.py

        python3 -W error scripts/test_advert_escrow.py

        python3 -W error scripts/test_query_encoding.py

        python3 -W error scripts/test_preparation_terminal.py

        python3 -W error scripts/test_discovery_heartbeat.py

        python3 -W error scripts/test_fresh_discovery_schedule.py

        python3 -W error scripts/test_engineering_evidence.py

        python3 -W error scripts/test_baseline_relationship.py

        python3 -W error scripts/test_base_branch.py

        python3 -W error scripts/test_cline_deliverable.py

        python3 -W error scripts/test_failure_taxonomy.py

        python3 -W error scripts/test_claim_lease.py

        python3 -W error scripts/test_dispatch_velocity.py

        python3 -W error scripts/test_liquidity_ordering.py

        python3 -W error scripts/test_lane_partition.py

        python3 -W error scripts/test_engine_identity.py

        python3 -W error scripts/test_capacity_gate.py

        python3 -W error scripts/test_hydration_capacity.py

        python3 -W error scripts/test_preparation_contract.py

        python3 -W error scripts/test_preflight.py

        python3 -W error scripts/test_download_patch_submodule.py

        python3 -W error scripts/test_heartbeat.py

        python3 -W error scripts/test_code_change_class.py

        python3 -W error scripts/test_f9_class_gate.py

        python3 -W error scripts/test_refusal_census.py

        python3 -W error scripts/test_failure_digest.py

        python3 -W error scripts/test_hardness_ordering.py

        python3 -W error scripts/test_competition_evidence.py

        python3 -W error scripts/test_urgency_ordering.py

        python3 -W error scripts/test_hydrate_only_path.py'
