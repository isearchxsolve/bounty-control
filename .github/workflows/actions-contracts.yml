name: Actions migration contracts
'on':
  pull_request:
    paths:
    - scripts/**
    - .github/workflows/**
  push:
    paths:
    - scripts/**
    - .github/workflows/**
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        sparse-checkout: '/scripts/

          /.github/

          /.gitmodules'
        sparse-checkout-cone-mode: false
    - name: Import the deployed pipeline package and its dependencies
      env:
        FLEET_SANDBOX_DIR: ${{ runner.temp }}/bounty-import-sandbox
        FLEET_ARTIFACT_DIR: ${{ runner.temp }}/bounty-import-artifacts
      run: |
        python3 -c "import sys; sys.path.insert(0, 'scripts'); import actions_dispatch, actions_delivery, actions_reconcile, agent_door, cline_entry_door, sovereign_discovery, pipeline_evidence, check_tracked_secrets"
    - name: Compile platform adapters
      run: python3 -W error -m py_compile scripts/actions_github.py scripts/actions_dispatch.py scripts/actions_delivery.py scripts/actions_reconcile.py
        scripts/actions_release.py scripts/bounty_admission.py scripts/bounty_fx.py scripts/kaggle_engine_worker.py scripts/delivery_supervisor.py
        scripts/discovery_heartbeat.py scripts/delivery_errors.py scripts/f11_refusal_census.py scripts/failure_digest.py
        scripts/agent_door.py scripts/cline_entry_door.py scripts/pipeline_evidence.py scripts/sovereign_discovery.py
    - name: Refuse credential literals without exposing their values
      run: python3 scripts/check_tracked_secrets.py
    - name: Refuse undefined names on the scheduled pipeline modules
      # F821 is the lint class that reaches production as a crash: run 40876500657 died with
      # "name 'report_path' is not defined" the first time any run reached that line. Scoped to
      # the modules the workflows actually execute, so legacy scratch seeds cannot fail the gate.
      run: |
        set -euo pipefail
        python3 -m pip install --quiet ruff
        python3 -m ruff check --select F821 \
          scripts/actions_github.py scripts/actions_dispatch.py scripts/actions_delivery.py \
          scripts/actions_reconcile.py scripts/actions_release.py scripts/bounty_admission.py \
          scripts/bounty_fx.py scripts/kaggle_engine_worker.py scripts/delivery_supervisor.py \
          scripts/delivery_errors.py scripts/discovery_heartbeat.py scripts/failure_digest.py \
          scripts/f11_refusal_census.py scripts/agent_door.py scripts/cline_entry_door.py \
          scripts/pipeline_evidence.py scripts/sovereign_discovery.py
    - name: Run master pipeline failure and regression suites
      env:
        PYTHONIOENCODING: utf-8
      run: python3 scripts/run_pipeline_master.py --output scratch/pipeline-master --timeout 180
    - name: Preserve master suite reports and failure logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-master-${{ github.run_id }}-${{ github.run_attempt }}
        path: scratch/pipeline-master/
        if-no-files-found: warn
        retention-days: 14
