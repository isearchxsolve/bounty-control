name: Bounty discovery and reconciliation
'on':
  schedule:
  - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}
concurrency:
  group: bounty-discovery
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      BOUNTY_STATE_DIR: /tmp/bounty-state
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        sparse-checkout: '/scripts/

          /.github/

          /.gitmodules'
        sparse-checkout-cone-mode: false
    - uses: actions/cache/restore@v4
      with:
        path: ${{ env.BOUNTY_STATE_DIR }}
        key: bounty-state-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: bounty-state-
    - name: Reconcile actual results and repair owned failing PRs
      run: python3 -u scripts/actions_reconcile.py --repair
    - name: Search all lanes and dispatch qualified originals
      # NVIDIA_API_KEY is scoped to this one step: the search planner and the agent door's
      # local gateway are the only readers. BOUNTY_ENTRY_DOOR=cline puts the agent in front of
      # the search (law 85); the static lanes above have already run, so a door failure costs
      # time and nothing else. Wedge the variable to 'off' to disable the door entirely.
      env:
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        BOUNTY_ENTRY_DOOR: ${{ vars.ENTRY_DOOR || 'cline' }}
        BOUNTY_ENTRY_MODEL: ${{ vars.ENTRY_MODEL || 'deepseek-ai/deepseek-v4.1-flash' }}
        NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL || 'deepseek-ai/deepseek-v4.1-flash' }}
        BOUNTY_AGENT_WORKSPACE: /tmp/bounty-agent
        BOUNTY_AGENT_ROUNDS: '2'
      run: python3 -u scripts/actions_dispatch.py --live --once --queries-per-lane 3 --max-dispatches 2 --lane ${{ vars.ACTIVE_LANES || 'all' }}
    - uses: actions/cache/save@v4
      if: always()
      with:
        path: ${{ env.BOUNTY_STATE_DIR }}
        key: bounty-state-${{ github.run_id }}-${{ github.run_attempt }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: discovery-${{ github.run_id }}
        path: ${{ env.BOUNTY_STATE_DIR }}
        if-no-files-found: error
        retention-days: 14
