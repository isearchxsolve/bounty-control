name: Bounty discovery and reconciliation
'on':
  schedule:
  - cron: '7,37 * * * *'
  workflow_dispatch: {}
concurrency:
  group: bounty-discovery
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  discover:
    runs-on: ubuntu-latest
    # Two agent rounds at their full budget, plus reconciliation. The search budget was
    # raised to 3600 s (below), which is 2 h for two rounds, so 45 min killed the run while
    # the agent was still filtering: measured 2026-11-03 (run 41564183447), 918 raw
    # candidates gathered, zero rows written, both rounds expired with 44 items pending.
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GH_DISCOVERY_PAT || secrets.GH_PAT }}
      BOUNTY_STATE_DIR: /tmp/bounty-state
      # Market study 2026-11-06 (docs/MARKET-STUDY-2026-11-06.md): only platform-escrow
      # attestations convert; verbal/sponsor offers closed unmerged 100% of the time in
      # our record. The door refuses non-bot offers when this is set.
      BOUNTY_ESCROW_ONLY: '1'
      # Expanded capacity ceiling to 10 GB so major funded monorepos (e.g. Expensify/App at 3.4 GB)
      # are not blocked by the default 750 MB runner gate.
      BOUNTY_MAX_REPOSITORY_KB: '10000000'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        sparse-checkout: '/scripts/

          /.github/

          /.gitmodules'
        sparse-checkout-cone-mode: false
    - uses: actions/cache/restore@v4
      with:
        path: ${{ env.BOUNTY_STATE_DIR }}
        key: bounty-state-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: bounty-state-
    # Measured on run 41188694229: a core-API rate limit inside reconcile killed the whole
    # discovery run ~4 minutes in, before the entry door had spent a single second searching.
    # Reconciliation is a bookkeeping pass, so it must never be able to destroy a search run.
    - name: Reconcile actual results and repair owned failing PRs
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GH_PAT }}
      run: python3 -u scripts/actions_reconcile.py --repair
    - name: Search all lanes and dispatch qualified originals
      # The production entry door chooses sources and supplies cited decisions. The
      # host verifies their evidence and streams them to generation-fenced dispatch.
      env:
        GH_TOKEN: ${{ secrets.GH_PAT }}
        GH_PAT: ${{ secrets.GH_PAT }}
        TOKENHARBOR_KEYS_JSON: ${{ secrets.TOKENHARBOR_KEYS_JSON }}
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        # The whole NVIDIA key pool, however the secret publishes it: a JSON list, a
        # {"keys": [...]} document, or newline/comma separated keys. One secret, 11 keys,
        # 11 separate accounts -- so a 429 spends one account's cooldown, not the brain.
        NVIDIA_KEYS_JSON: ${{ secrets.NVIDIA_KEYS_JSON }}
        BOUNTY_ENTRY_DOOR: ${{ vars.ENTRY_DOOR || 'cline' }}
        BOUNTY_ENTRY_MODEL: ${{ vars.ENTRY_MODEL || 'deepseek-v4.1-flash:free' }}
        TOKENHARBOR_MODEL: 'deepseek-v4.1-flash:free'
        # The parachute's brain, named the one variable the worker's failover, the door's proxy
        # and nvidia_router all read. Measured 2026-11-02: this line used to set NVIDIA_MODEL to
        # the TokenHarbor model name, which nothing read and NVIDIA does not serve, so when
        # TokenHarbor was exhausted every one of the door's turns died before writing a row.
        NVIDIA_ROUTER_MODEL: ${{ vars.NVIDIA_DELIVERY_MODEL || 'mistralai/mistral-large-4-1t-a52b' }}
        BOUNTY_AGENT_ROUNDS: '1'
        BOUNTY_AGENT_MEMORY: ${{ env.BOUNTY_STATE_DIR }}/discovery-memory
        # Search is a heavy task: a full lane sweep gathers hundreds of raw candidates and the
        # filtering and evidence check that produces a verified row happens after them. 800-900 s
        # expired mid-filter before rows landed (run 41564183447, run 42310612968), so the
        # budget is set to 1800 s (30m) inside the 45m job ceiling.
        BOUNTY_AGENT_TIMEOUT: '1800'
      run: python3 -u scripts/actions_dispatch.py --live --once --queries-per-lane 8 --max-dispatches 12 --lane ${{ vars.ACTIVE_LANES || 'all' }}
    - name: Observe published PR review and conversion receipts
      continue-on-error: true
      # 100 authored PRs measured past this step's old 3-minute bound on run 42226995018 and
      # the watcher was killed mid-sweep - inside a run that still reported success, because
      # continue-on-error hides it. Coverage stays at 100 (86 open PRs are in the author
      # search); the bound moves instead, still far inside the job's own ceiling.
      timeout-minutes: 10
      env:
        BOUNTY_ACCOUNT: ${{ github.repository_owner }}
      run: |
        status=0
        # ATT-P15 (2026-11-06 attention proposal): observe every authored PR, not the 20
        # most recently updated - 86 are open in the author search, and the coverage
        # receipt now reports any remainder as truncated instead of silently dropping it.
        python3 -u scripts/pr_conversion_watch.py --author "$BOUNTY_ACCOUNT" --limit 100 --out "$BOUNTY_STATE_DIR/pr-conversion" || status=$?
        if [ "$status" -eq 2 ]; then
          echo "Published PRs have follow-up obligations; receipts retained."
        else
          exit "$status"
        fi
    - name: Purge ephemeral scout workspaces from state
      if: always()
      run: rm -rf "${{ env.BOUNTY_STATE_DIR }}/agent-workspaces"
    - uses: actions/cache/save@v4
      if: always()
      with:
        path: ${{ env.BOUNTY_STATE_DIR }}
        key: bounty-state-${{ github.run_id }}-${{ github.run_attempt }}
    - uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: discovery-${{ github.run_id }}
        path: ${{ env.BOUNTY_STATE_DIR }}
        if-no-files-found: warn
        retention-days: 1
